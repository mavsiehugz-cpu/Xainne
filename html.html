<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday ❤️</title>

<style>
    .pop-heart{
    position:absolute;
    font-size:18px;
    animation:popFloat 2.5s ease-out forwards;
    pointer-events:none;
    z-index:999;
}

@keyframes floatHeart{
    0%{
        transform:translate(0, 110vh) scale(0.8);
        opacity:0;
    }

    10%{
        opacity:1;
    }

    50%{
        transform:translate(20px, 0vh) scale(1);
    }

    100%{
        transform:translate(-20px, -120vh) scale(1.2);
        opacity:0;
    }
}
    body{
    position:relative;
}
    
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#F5E6D3;
    font-family:Georgia, serif;
}

/* Hearts */
.heart{
    position:absolute;
    color:#d94b4b;
    opacity:.7;
    animation:floatHeart linear infinite;
}

@keyframes floatHeart{
    from{transform:translateY(110vh);}
    to{transform:translateY(-20vh);}
}

/* Sparkles */
.sparkle{
    position:absolute;
    color:gold;
    animation:twinkle 2s infinite;
}

@keyframes twinkle{
    0%,100%{opacity:.2;transform:scale(.8);}
    50%{opacity:1;transform:scale(1.3);}
}

/* Container */
.container{
    text-align:center;
    z-index:10;
}

/* Button */
#openBtn{
    padding:16px 40px;
    border:none;
    border-radius:50px;
    background:#d94b4b;
    color:white;
    font-size:22px;
    cursor:pointer;
    transition:.3s;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

#openBtn:hover{
    transform:scale(1.08);
}

/* Envelope wrapper */
.envelope-wrapper{
    display:none;
}

.envelope{
    position:relative;
    width:350px;
    height:240px;
    margin:auto;
    overflow:visible; /* FIX */
}


/* Back */
.back{
    position:absolute;
    width:100%;
    height:100%;
    background:#e8c19b;
    z-index:1;
}

.letter{
    -webkit-mask-image: linear-gradient(
        to bottom,
        black 60%,
        transparent 100%
    );
    mask-image: linear-gradient(
        to bottom,
        black 60%,
        transparent 100%
    );
    
    position:absolute;
    width:300px;
    height:320px;

    left:25px;
    bottom:0;

    background:white;
    border-radius:10px;
    padding:20px;

    overflow-y:auto;

    box-shadow:0 10px 30px rgba(0,0,0,.15);

    z-index:2;

    /* 🔥 FULLY HIDDEN INSIDE ENVELOPE */
    transform:translateY(180px);
    opacity:0;

    transition:1.6s ease;
    
}

/* Front pocket */
.front{
    position:absolute;
    bottom:0;
    width:100%;
    height:65%;
    background:#d9ab7c;
    clip-path:polygon(0 0, 50% 55%, 100% 0, 100% 100%, 0 100%);

    z-index:3;
}


.flap{
    position:bottom;
    top:0;
    width:0;
    height:0;

    border-left:175px solid transparent;
    border-right:175px solid transparent;
    border-top:120px solid #c89463;

    transform-origin:top;
    transition:1.2s ease;

    z-index:5; /* 🔥 highest layer */
}

/* OPEN */
.envelope.open .flap{
    transform:rotateX(180deg);
}

.envelope.open .letter{
    transform:translateY(-30px); /* moves upward out of envelope */
    opacity:1;
}

/* Text */
.letter h2{
    color:#d94b4b;
    margin-bottom:10px;
}

.letter p{
    line-height:1.8;
    color:#444;
    white-space:pre-line;
}
    
    #heartLayer{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
    overflow:hidden;
    z-index:999;
}
</style>
</head>

<body>
    <div id="heartLayer"></div>

<div id="hearts"></div>
<div id="sparkles"></div>

<div class="container">

    <button id="openBtn">Click Here ❤️</button>

    <div class="envelope-wrapper" id="wrapper">

        <div class="envelope" id="envelope">

            <div class="back"></div>

            <div class="letter">
                <h2>Happy Birthday ❤️</h2>
                <p id="message"></p>
            </div>

            <div class="front"></div>
            <div class="flap"></div>

        </div>

    </div>

</div>

<script>

/* Hearts */
for(let i=0;i<30;i++){
    const h=document.createElement("div");
    h.className="heart";

    h.style.fontSize=(15+Math.random()*25)+"px";
    h.style.animationDuration=(8+Math.random()*10)+"s";

for(let i=0;i<40;i++){

    s.style.top=Math.random()*100+"vh";

let i = 0;
function typeWriter(){
    if(i < text.length){
        document.getElementById("message").innerHTML += text.charAt(i);
        i++;
        setTimeout(typeWriter, -50);
    }
}

/* Open */
    function spawnHearts(){
    const emojis = ["❤️","💖","💗","💘","💞","💓"];

    for(let i=0;i<25;i++){
        const heart = document.createElement("div");
        heart.classList.add("FloatHeart");

        heart.innerText = emojis[Math.floor(Math.random()*emojis.length)];

        // random position across screen
        heart.style.left = Math.random()*100 + "vw";
        heart.style.top = (60 + Math.random()*30) + "vh";

        heart.style.fontSize = (14 + Math.random()*22) + "px";

        document.getElementById("heartLayer").appendChild(h);

        setTimeout(()=>{
            heart.remove();
        },2500);
    }
}
   
document.getElementById("openBtn").addEventListener("click", ()=>{

    document.getElementById("openBtn").style.display="none";
    document.getElementById("wrapper").style.display="block";

    setTimeout(()=>{
    document.getElementById("envelope").classList.add("open");
    typeWriter();

    spawnHearts(); // 💖 ADD THIS

},500);

});

</script>
    

</body>
</html>
